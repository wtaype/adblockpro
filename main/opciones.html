<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opciones - AdBlock Pro</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #101827;
        background: #f6f8fb;
      }

      body {
        margin: 0;
      }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 40px auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #667085;
        line-height: 1.55;
      }

      section {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AdBlock Pro</h1>
      <p>Configuracion ligera para una extension silenciosa, rapida y enfocada en privacidad.</p>

      <section>
        <strong>Version inicial</strong>
        <p>El bloqueo base usa reglas declarativas de Chrome para reducir consumo de memoria y evitar procesos innecesarios.</p>
      </section>
    </main>
  </body>
</html>
